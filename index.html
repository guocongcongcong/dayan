<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>大衍 · 十八变而成卦</title>
<meta name="description" content="大衍筮法电子起卦：分二、挂一、揲四、归奇，逐变真推演十八变而定卦。">
<meta name="theme-color" content="#100f0d">
<meta property="og:title" content="大衍 · 十八变而成卦">
<meta property="og:description" content="分二、挂一、揲四、归奇 —— 逐变真推演十八变。">
<meta property="og:type" content="website">
<style>
  :root{
    --bg:#100f0d; --panel:#191713; --line:#2a2620;
    --text:#e9e3d6; --dim:#8d8578; --gold:#c8a25c; --accent:#e0a24a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{
    background:radial-gradient(120% 80% at 50% -10%, #23201a 0%, var(--bg) 55%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex;justify-content:center;
    padding:34px 18px 48px;
  }
  .app{width:100%;max-width:470px}

  /* ── 头部 ── */
  .brand{text-align:center;margin-bottom:34px}
  .brand h1{
    font-family:"Songti SC","Noto Serif SC",serif;
    font-size:30px;font-weight:600;letter-spacing:.42em;
    margin:0 0 12px;padding-left:.42em;color:var(--gold);
  }
  .brand p{margin:0;font-size:12.5px;color:var(--dim);letter-spacing:.16em}

  /* ── 起卦按钮 ── */
  .stage{min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .cast-btn{
    position:relative;width:168px;height:168px;border-radius:50%;
    background:radial-gradient(circle at 50% 38%, #2b2519 0%, #17140f 70%);
    border:1px solid #3d3527;color:var(--gold);
    font-family:"Songti SC","Noto Serif SC",serif;
    font-size:23px;letter-spacing:.3em;padding-left:.3em;cursor:pointer;
    box-shadow:0 0 0 1px #000 inset,0 18px 44px -22px #000,0 0 46px -22px var(--gold);
    transition:transform .18s ease,border-color .25s ease,box-shadow .35s ease;
  }
  .cast-btn::after{
    content:"";position:absolute;inset:-9px;border-radius:50%;
    border:1px solid #2c261b;
  }
  .cast-btn:active{transform:scale(.965)}
  .cast-btn:hover{border-color:var(--gold);box-shadow:0 0 0 1px #000 inset,0 18px 44px -22px #000,0 0 60px -14px var(--gold)}
  .cast-btn[disabled]{opacity:.85;cursor:default}

  .hint{margin-top:22px;font-size:11.5px;color:#5f594e;letter-spacing:.18em}

  /* ── 推演中 ── */
  .running{text-align:center}
  .running .tick{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:13px;color:var(--gold);letter-spacing:.22em;min-height:20px;
  }
  .running .bar{width:132px;height:2px;background:#241f18;margin:16px auto 0;overflow:hidden;border-radius:2px}
  .running .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .06s linear}

  /* ── 结果 ── */
  .result{display:none;width:100%;animation:rise .5s ease both}
  .result.on{display:block}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .pair{display:flex;align-items:stretch;gap:10px;margin-bottom:22px}
  .hex{
    flex:1;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:14px 12px 13px;text-align:center;min-width:0;
  }
  .hex .cap{font-size:10.5px;color:var(--dim);letter-spacing:.24em;margin-bottom:11px}
  .hex .glyph{font-size:26px;line-height:1;color:var(--gold);margin-bottom:9px}
  .hex .nm{font-family:"Songti SC","Noto Serif SC",serif;font-size:17px;letter-spacing:.1em;white-space:nowrap}
  .hex.ghost .glyph{opacity:.78}
  .hex.ghost .nm{color:#cbc3b2}
  .arrow{display:flex;align-items:center;color:#4a4438;font-size:15px;padding:0 1px}

  /* 六爻图 */
  .draw{margin:12px auto 0;display:flex;flex-direction:column;gap:5px;width:100%;max-width:108px}
  .row{display:flex;align-items:center;gap:5px;height:7px}
  .bar{height:7px;border-radius:1px;background:#cfc4ab;flex:1}
  .bar.break{background:none;display:flex;gap:9px}
  .bar.break span{flex:1;height:7px;border-radius:1px;background:#cfc4ab}
  .row.mv .bar,.row.mv .bar.break span{background:var(--accent);box-shadow:0 0 10px -2px var(--accent)}
  .mk{width:8px;font-size:9px;color:var(--accent);text-align:center;flex:none}

  /* 数字条 */
  .nums{display:flex;justify-content:space-between;gap:4px;margin:0 0 20px;
        background:#141210;border:1px solid var(--line);border-radius:10px;padding:11px 12px}
  .num{flex:1;text-align:center;min-width:0}
  .num b{display:block;font-family:ui-monospace,Menlo,monospace;font-size:16px;font-weight:600;line-height:1.35}
  .num i{display:block;font-style:normal;font-size:9.5px;color:#6b6458;margin-top:3px;letter-spacing:.1em}
  .num.y b{color:#d8c69a}
  .num.yin b{color:#9c9484}
  .num.mv b{color:var(--accent)}
  .num.mv i{color:#8a6a34}

  .meta{font-size:12px;color:var(--dim);text-align:center;margin-bottom:18px;letter-spacing:.08em;line-height:1.9}
  .meta em{font-style:normal;color:var(--accent)}

  .acts{display:flex;flex-wrap:wrap;gap:9px}
  .acts .btn{flex:1 1 46%;min-width:0}
  .btn{
    flex:1;height:42px;border-radius:9px;border:1px solid var(--line);
    background:#1b1814;color:#b9b1a2;font-size:13px;letter-spacing:.1em;cursor:pointer;
    transition:border-color .2s,color .2s;
  }
  .btn:hover{border-color:#453d2e;color:var(--text)}
  .btn.primary{background:linear-gradient(180deg,#241f16,#1a1712);border-color:#4a3f2a;color:var(--gold)}

  /* 十八变明细 */
  .detail{display:none;margin-top:18px;background:#141210;border:1px solid var(--line);
          border-radius:10px;padding:14px;font-size:12px}
  .detail.on{display:block}
  .detail h4{margin:0 0 11px;font-size:11px;font-weight:500;color:var(--dim);letter-spacing:.2em}
  .dl{display:grid;grid-template-columns:46px 1fr auto auto;gap:8px 8px;
      font-family:ui-monospace,Menlo,monospace;font-size:12px;align-items:center}
  .dl .k{color:#6b6458;font-size:11px}
  .dl .c{color:#b6ad9c;letter-spacing:.1em}
  .dl .r{color:#7d7568;font-size:11px}
  .dl .v{color:var(--gold);text-align:right}
  .dl .v.mv{color:var(--accent)}
  .note{margin:12px 0 0;font-size:10.5px;color:#5a5449;line-height:1.75}

  /* 页脚模式开关 */
  .foot{margin-top:30px;text-align:center;font-size:10.5px;color:#4e4840;letter-spacing:.12em}
  .mode-sw{display:inline-flex;border:1px solid #2a2419;border-radius:6px;overflow:hidden;margin-top:9px}
  .mode-sw button{background:none;border:0;color:#5c554a;font-size:10.5px;padding:4px 11px;cursor:pointer;letter-spacing:.1em}
  .mode-sw button.on{background:#251f15;color:var(--gold)}

  .sheet{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
         padding:22px;background:rgba(8,7,6,.93);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .sheet.on{display:flex;animation:fade .25s ease both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet-in{width:100%;max-width:400px;text-align:center}
  .sheet img{width:100%;display:block;border-radius:10px;border:1px solid #2a2620;
             box-shadow:0 28px 70px -24px #000}
  .sheet-acts{display:flex;gap:9px;margin-top:16px}
  .sheet-acts .btn{flex:1;height:44px}

  .toast{
    position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);
    background:#2a2419;color:var(--gold);font-size:12px;letter-spacing:.1em;
    padding:9px 18px;border-radius:20px;border:1px solid #463a26;
    opacity:0;pointer-events:none;transition:all .3s ease;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">

  <div class="brand">
    <h1>大衍</h1>
    <p>大衍之数五十 · 其用四十有九 · 十八变而成卦</p>
  </div>

  <div class="stage" id="stage">
    <button class="cast-btn" id="castBtn">摇卦</button>
    <div class="hint">分二 · 挂一 · 揲四 · 归奇</div>
  </div>

  <div class="result" id="result">
    <div class="pair">
      <div class="hex">
        <div class="cap">本 卦</div>
        <div class="glyph" id="pGlyph">䷀</div>
        <div class="nm" id="pName">乾为天</div>
        <div class="draw" id="pDraw"></div>
      </div>
      <div class="arrow">→</div>
      <div class="hex ghost">
        <div class="cap" id="cCap">变 卦</div>
        <div class="glyph" id="cGlyph">䷀</div>
        <div class="nm" id="cName">乾为天</div>
        <div class="draw" id="cDraw"></div>
      </div>
    </div>

    <div class="nums" id="nums"></div>
    <div class="meta" id="meta"></div>

    <div class="acts">
      <button class="btn primary" id="againBtn">再摇一次</button>
      <button class="btn primary" id="cardBtn">生成卡片</button>
      <button class="btn" id="detailBtn">十八变明细</button>
      <button class="btn" id="copyBtn">复制文本</button>
    </div>

    <div class="detail" id="detail">
      <h4>十 八 变 明 细（初爻在下）</h4>
      <div class="dl" id="dl"></div>
      <p class="note">
        一变收 5 或 9，二三变收 4 或 8；三变毕，余 36/32/28/24，除以四得 9/8/7/6。<br>
        9 老阳、6 老阴为动爻，动则变。
      </p>
    </div>
  </div>

  <div class="foot">
    <div class="mode-sw">
      <button data-mode="true" class="on">保真推演</button>
      <button data-mode="classic">经典概率</button>
    </div>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-in">
    <img id="cardImg" alt="卦象卡片">
    <div class="sheet-acts">
      <button class="btn primary" id="saveBtn">保存图片</button>
      <button class="btn" id="shareBtn">分享</button>
      <button class="btn" id="closeBtn">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">已复制</div>

<script src="data/hexagrams.js"></script>
<script src="lib/engine.js"></script>
<script src="lib/card.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const POS = ['初', '二', '三', '四', '五', '上'];
  const posOf = i => POS[i - 1];        // 动爻位置是 1-based（1=初爻）
  const LABEL = { 9: '老阳', 8: '少阴', 7: '少阳', 6: '老阴' };
  const MARK = { 9: '○', 6: '×' };
  const isYang = v => v === 9 || v === 7;
  const isMoving = v => v === 6 || v === 9;

  let mode = 'true';
  let current = null;

  /* 画六爻：上爻在最上，初爻在最下 */
  function draw(el, binary, lines) {
    el.innerHTML = '';
    for (let i = 5; i >= 0; i--) {
      const row = document.createElement('div');
      row.className = 'row' + (isMoving(lines[i]) ? ' mv' : '');
      const bar = document.createElement('div');
      bar.className = 'bar' + (binary[i] ? '' : ' break');
      if (!binary[i]) bar.innerHTML = '<span></span><span></span>';
      row.appendChild(bar);
      const mk = document.createElement('div');
      mk.className = 'mk';
      mk.textContent = MARK[lines[i]] || '';
      row.appendChild(mk);
      el.appendChild(row);
    }
  }

  function render(r) {
    current = r;
    $('pGlyph').textContent = r.primary.symbol;
    $('pName').textContent = r.primary.name;
    $('cGlyph').textContent = r.changed.symbol;
    $('cName').textContent = r.changed.name;
    $('cCap').textContent = r.moving.length ? '变 卦' : '无 变';
    draw($('pDraw'), r.primaryBinary, r.lines);
    draw($('cDraw'), r.changedBinary, r.lines);

    const nums = $('nums');
    nums.innerHTML = '';
    r.lines.forEach((v, i) => {
      const d = document.createElement('div');
      d.className = 'num ' + (isMoving(v) ? 'mv' : (isYang(v) ? 'y' : 'yin'));
      d.innerHTML = '<b>' + v + '</b><i>' + POS[i] + '</i>';
      nums.appendChild(d);
    });

    const mv = r.moving;
    $('meta').innerHTML = mv.length
      ? '动爻：' + mv.map(i => posOf(i) + '爻').join('、') + '　<em>' +
        mv.map(i => MARK[r.lines[i - 1]] + ' ' + LABEL[r.lines[i - 1]]).join('　') + '</em>'
      : '静卦 · 六爻皆不动';

    const dl = $('dl');
    dl.innerHTML = '';
    r.steps.forEach((c, i) => {
      const v = r.lines[i];
      const remain = 49 - c.reduce((a, b) => a + b, 0);
      dl.insertAdjacentHTML('beforeend',
        '<div class="k">' + POS[i] + '爻</div>' +
        '<div class="c">' + c.join('　') + '</div>' +
        '<div class="r">余 ' + remain + '</div>' +
        '<div class="v' + (isMoving(v) ? ' mv' : '') + '">' + v + ' ' + LABEL[v] + '</div>');
    });
  }

  function run() {
    const btn = $('castBtn');
    btn.disabled = true;
    $('result').classList.remove('on');
    $('stage').innerHTML =
      '<div class="running">' +
        '<div class="tick" id="tick">第 一 变</div>' +
        '<div class="bar"><i id="pbar"></i></div>' +
      '</div>';

    const r = DayanEngine.cast(mode);
    let n = 0;
    const CN = ['一','二','三','四','五','六','七','八','九','十'];
    const cn = x => x <= 10 ? CN[x - 1] : '十' + CN[x - 11];

    const timer = setInterval(() => {
      n++;
      const t = $('tick'), p = $('pbar');
      if (t) t.textContent = '第 ' + cn(Math.min(n, 18)) + ' 变';
      if (p) p.style.width = (Math.min(n, 18) / 18 * 100) + '%';
      if (n >= 18) {
        clearInterval(timer);
        $('stage').innerHTML =
          '<button class="cast-btn" id="castBtn">摇卦</button>' +
          '<div class="hint">分二 · 挂一 · 揲四 · 归奇</div>';
        $('castBtn').onclick = run;
        render(r);
        $('result').classList.add('on');
      }
    }, 34);
  }

  $('castBtn').onclick = run;

  $('againBtn').onclick = () => {
    $('result').classList.remove('on');
    $('detail').classList.remove('on');
    $('stage').innerHTML =
      '<button class="cast-btn" id="castBtn">摇卦</button>' +
      '<div class="hint">分二 · 挂一 · 揲四 · 归奇</div>';
    $('castBtn').onclick = run;
  };

  $('detailBtn').onclick = () => $('detail').classList.toggle('on');

  $('copyBtn').onclick = () => {
    const r = current;
    const text = [
      '大衍筮法 · ' + new Date().toLocaleString('zh-CN'),
      '六爻（初→上）：' + r.lines.join(' '),
      '本卦　' + r.primary.name + ' ' + r.primary.symbol,
      '变卦　' + r.changed.name + ' ' + r.changed.symbol,
      '动爻　' + (r.moving.length ? r.moving.map(i => posOf(i) + '爻').join('、') : '无（静卦）'),
      '十八变：' + r.steps.map(c => c.join('/')).join('  ')
    ].join('\n');

    const done = () => {
      const el = $('toast');
      el.classList.add('on');
      setTimeout(() => el.classList.remove('on'), 1400);
    };
    // file:// 下 navigator.clipboard 不可用，退回 execCommand
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done).catch(fallbackCopy);
    } else {
      fallbackCopy();
    }
    function fallbackCopy() {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;top:-999px;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); }
      catch (e) { alert(text); }
      document.body.removeChild(ta);
    }
  };

  /* ── 分享卡片 ── */
  let cardBlob = null, cardUrl = null;

  $('cardBtn').onclick = () => {
    if (!current) return;
    const cv = document.createElement('canvas');
    DayanCard.render(cv, current);
    cv.toBlob(blob => {
      cardBlob = blob;
      if (cardUrl) URL.revokeObjectURL(cardUrl);
      cardUrl = URL.createObjectURL(blob);
      $('cardImg').src = cardUrl;
      $('sheet').classList.add('on');
    }, 'image/png');
  };

  $('saveBtn').onclick = () => {
    if (!cardUrl) return;
    const a = document.createElement('a');
    a.href = cardUrl;
    a.download = '大衍-' + new Date().toISOString().slice(0, 10) + '.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };

  $('shareBtn').onclick = () => {
    if (!cardBlob) return;
    const file = new File([cardBlob], 'dayan.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: '大衍' }).catch(() => {});
    } else {
      $('saveBtn').onclick();
    }
  };

  $('closeBtn').onclick = () => $('sheet').classList.remove('on');
  $('sheet').onclick = e => { if (e.target === $('sheet')) $('sheet').classList.remove('on'); };

  document.querySelectorAll('.mode-sw button').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('.mode-sw button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      mode = b.dataset.mode;
    };
  });

  // 分享链接可直接出卦：index.html#auto
  if (location.hash === '#auto') setTimeout(run, 30);
})();
</script>
</body>
</html>
